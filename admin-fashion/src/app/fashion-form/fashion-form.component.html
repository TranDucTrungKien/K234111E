<div class="container">
  <h2>{{ isEdit ? 'Edit Fashion' : 'Add New Fashion' }}</h2>

  <div *ngIf="errMessage" class="error">{{ errMessage }}</div>

  <form (ngSubmit)="save()" #fashionForm="ngForm">
    <div class="form-group">
      <label>Title <span class="required">*</span></label>
      <input type="text" [(ngModel)]="fashion.title" name="title" required class="form-control" placeholder="Fashion title..." />
    </div>

    <div class="form-group">
      <label>Style <span class="required">*</span></label>
      <input type="text" [(ngModel)]="fashion.style" name="style" required class="form-control" placeholder="e.g. Street Style, Trends, Casual" />
    </div>

    <div class="form-group">
      <label>Thumbnail URL</label>
      <input type="text" [(ngModel)]="fashion.thumbnail" name="thumbnail" class="form-control" placeholder="https://..." />
      <img *ngIf="fashion.thumbnail" [src]="fashion.thumbnail" alt="preview" class="thumb-preview" />
    </div>

    <div class="form-group">
      <label>Detail (WYSIWYG)</label>
      <quill-editor
        [(ngModel)]="fashion.detail"
        name="detail"
        [modules]="quillModules"
        [styles]="{'min-height': '200px'}"
        placeholder="Enter fashion detail..."
      ></quill-editor>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-save">{{ isEdit ? 'Update' : 'Save' }}</button>
      <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>
